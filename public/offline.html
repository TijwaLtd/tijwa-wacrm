<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Tijwa CRM</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      img { width: 160px; height: auto; margin-bottom: 24px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
      p { font-size: 14px; color: #94a3b8; margin: 0 0 20px; line-height: 1.5; }
      button {
        background: #dc2626;
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #b91c1c; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-512.png" alt="Tijwa CRM" />
      <h1>You&rsquo;re offline</h1>
      <p>
        This page needs a connection. Cached pages may still work, but
        live messages require the network.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
